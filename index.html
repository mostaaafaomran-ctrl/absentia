<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>غيابي | Absentia: tracker for university absences</title>
<meta name="description" content="Track absences per course and see how many you can still skip before the university limit (default 25%). Arabic and English. Saved in your browser, no signup.">
<meta property="og:title" content="غيابي | Absentia">
<meta property="og:description" content="Count absences per course and get a warning before you hit the university limit. Free, offline, no signup.">
<meta property="og:type" content="website">
<meta property="og:image" content="og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="og.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%2322c58b'/%3E%3Cpath d='M28 52l16 16 28-32' stroke='%23fff' stroke-width='11' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{--mint:#dff7ec;--g:#22c58b;--gd:#0d7a56;--coral:#ff6b5e;--amber:#ffb020;--ink:#12332a;--bg:#f3fbf7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Noto Sans Arabic","Segoe UI",system-ui,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:24px 16px 50px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
h1{margin:0;font-size:34px;color:var(--gd)}
h1 small{font-size:15px;color:#5b8a7a;font-weight:500;margin-inline-start:8px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.tools input{width:64px;padding:7px;border:2px solid var(--g);border-radius:12px;font:inherit;text-align:center;background:#fff}
.tools button,.add button{background:var(--g);color:#fff;border:0;border-radius:14px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer}
.tools button.l{background:#fff;color:var(--gd);border:2px solid var(--g)}
.add{display:flex;gap:8px;background:#fff;padding:12px;border-radius:20px;box-shadow:0 6px 20px #22c58b22;margin-bottom:22px;flex-wrap:wrap}
.add input{flex:1 1 160px;padding:10px 12px;border:2px solid var(--mint);border-radius:12px;font:inherit}
.add input.s{flex:0 0 120px}
.card{background:#fff;border-radius:22px;padding:18px 20px;margin-bottom:14px;box-shadow:0 6px 20px #22c58b1f;border-inline-start:10px solid var(--g)}
.card.warn{border-color:var(--amber)}.card.edge{border-color:var(--coral)}.card.out{border-color:#c0261a;background:#fff5f4}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.name{font-size:20px;font-weight:700}
.badge{font-size:13px;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--mint);color:var(--gd)}
.warn .badge{background:#fff1d1;color:#9a6200}.edge .badge{background:#ffe0dc;color:#b3261a}.out .badge{background:#c0261a;color:#fff}
.bar{height:12px;background:var(--mint);border-radius:9px;margin:12px 0;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--g);border-radius:9px;transition:width .3s}
.warn .bar i{background:var(--amber)}.edge .bar i,.out .bar i{background:var(--coral)}
.ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:#4c7a6b}
.ctl button{border:2px solid var(--g);background:#fff;color:var(--gd);width:38px;height:38px;border-radius:12px;font-size:20px;font-weight:800;cursor:pointer}
.ctl button.abs{background:var(--coral);border-color:var(--coral);color:#fff;width:auto;padding:0 16px;font-size:15px}
.ctl .sp{flex:1}.ctl .del{border:0;color:#b3261a;width:auto;background:none;font-size:13px}
.empty{text-align:center;color:#5b8a7a;padding:36px 10px;background:#fff;border-radius:22px}
footer{text-align:center;font-size:13px;color:#5b8a7a;margin-top:24px}footer a{color:var(--gd)}
</style>
</head>
<body>
<div class="wrap">
<header><h1>غيابي <small>Absentia</small></h1>
<div class="tools"><span id="t-lim"></span><input id="lim" type="number" min="1" max="100" value="25">%<button class="l" id="lang">EN</button></div></div>
<div class="add"><input id="nm"><input class="s" id="tt" type="number" min="1" value="28"><button id="ad"></button></div>
<div id="list"></div>
<footer id="ft"></footer>
</div>
<script src="core.js"></script>
<script>
var $=function(i){return document.getElementById(i)};
var S=JSON.parse(localStorage.getItem('absentia')||'null')||{lang:'ar',lim:25,courses:[{id:1,name:'Data Structures',total:28,absent:3},{id:2,name:'Calculus II',total:28,absent:7},{id:3,name:'Physics',total:14,absent:4}]};
var T={ar:{lim:'حد الغياب المسموح:',nm:'اسم المادة',tt:'عدد المحاضرات',ad:'إضافة',left:'تقدر تغيب بعد',left1:' مرة',edge:'ده آخر غياب مسموح، متغيبش تاني',out:'تعدّيت الحد: ',lec:'محاضرة',of:'من',abs:'غياب',attended:'حضرت',minus:'تراجع',empty:'ضيف أول مادة فوق.',del:'حذف',ft:'اتحفظ في المتصفح عندك بس. حد الغياب في أغلب الجامعات 25%، اتأكد من لايحة كليتك.',over:' غياب زيادة'},
en:{lim:'Allowed absence limit:',nm:'Course name',tt:'Total sessions',ad:'Add',left:'You can still miss',left1:' more',edge:'This is your last allowed absence. Do not miss another.',out:'Over the limit by ',lec:'sessions',of:'of',abs:'absent',attended:'Missed one',minus:'Undo',empty:'Add your first course above.',del:'Delete',ft:'Saved in your browser only. Many universities use 25%; check your faculty rules.',over:''}};
function save(){localStorage.setItem('absentia',JSON.stringify(S))}
function render(){
  var t=T[S.lang];document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==='ar'?'rtl':'ltr';
  $('t-lim').textContent=t.lim;$('lim').value=S.lim;$('nm').placeholder=t.nm;$('tt').placeholder=t.tt;$('ad').textContent=t.ad;$('ft').innerHTML=t.ft+' · <a href="https://github.com/mostaaafaomran-ctrl/absentia">GitHub</a>';$('lang').textContent=S.lang==='ar'?'EN':'عربي';
  if(!S.courses.length){$('list').innerHTML='<div class="empty">'+t.empty+'</div>';return}
  $('list').innerHTML=S.courses.map(function(c){
    var s=Absentia.status(c,S.lim),msg;
    if(s.state==='out')msg=t.out+(-s.left)+(S.lang==='ar'?' محاضرة':'');
    else if(s.state==='edge')msg=t.edge;
    else msg=t.left+' '+s.left+(S.lang==='ar'?t.left1:t.left1);
    var w=Math.min(100,s.maxAbs?c.absent/s.maxAbs*100:100);
    return '<div class="card '+s.state+'"><div class="row"><span class="name">'+esc(c.name)+'</span><span class="badge">'+msg+'</span></div><div class="bar"><i style="width:'+w+'%"></i></div><div class="ctl"><button class="abs" data-a="'+c.id+'">+ '+(S.lang==='ar'?'غبت':'Missed')+'</button><button data-m="'+c.id+'" title="'+t.minus+'">−</button><span>'+c.absent+' '+t.abs+' '+t.of+' '+s.maxAbs+' ('+s.pct+'% / '+c.total+' '+t.lec+')</span><span class="sp"></span><button class="del" data-d="'+c.id+'">'+t.del+'</button></div></div>'}).join('');
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
document.addEventListener('click',function(e){var d=e.target.dataset;
  function f(id){return S.courses.filter(function(c){return c.id==id})[0]}
  if(d.a){f(d.a).absent++}else if(d.m){var c=f(d.m);c.absent=Math.max(0,c.absent-1)}else if(d.d){S.courses=S.courses.filter(function(c){return c.id!=d.d})}else return;
  save();render()});
$('ad').onclick=function(){var n=$('nm').value.trim();if(!n)return;S.courses.push({id:Date.now(),name:n,total:+$('tt').value||14,absent:0});$('nm').value='';save();render()};
$('nm').addEventListener('keydown',function(e){if(e.key==='Enter')$('ad').click()});
$('lim').oninput=function(){S.lim=Math.min(100,Math.max(1,+this.value||25));save();render()};
$('lang').onclick=function(){S.lang=S.lang==='ar'?'en':'ar';save();render()};
render();
</script>
</body>
</html>
